<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pot 翻译插件</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: none;
      font-size: 14px;
    }
    .button-group {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    .response {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: white;
      min-height: 50px;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pot 翻译</h1>
    <textarea id="inputText" placeholder="请输入需要翻译的文本"></textarea>
    <div class="button-group">
      <button onclick="translateText()">翻译</button>
      <button onclick="selectionTranslate()">划词翻译</button>
      <button onclick="ocrRecognize()">截图 OCR</button>
      <button onclick="ocrTranslate()">截图翻译</button>
    </div>
    <div class="response" id="response"></div>
  </div>

  <script>
    const port = 60828;
    const baseUrl = `http://127.0.0.1:${port}`;

    async function translateText() {
      const inputText = document.getElementById('inputText').value;
      if (!inputText) {
        document.getElementById('response').innerHTML = '<span class="error">请输入需要翻译的文本</span>';
        return;
      }

      try {
        const response = await fetch(baseUrl, {
          method: 'POST',
          body: inputText
        });
        if (response.ok) {
          document.getElementById('response').innerHTML = '翻译请求已发送';
        } else {
          document.getElementById('response').innerHTML = `<span class="error">请求失败: ${response.status}</span>`;
        }
      } catch (error) {
        document.getElementById('response').innerHTML = `<span class="error">错误: ${error.message}</span>`;
      }
    }

    async function selectionTranslate() {
      try {
        const response = await fetch(`${baseUrl}/selection_translate`);
        if (response.ok) {
          document.getElementById('response').innerHTML = '划词翻译请求已发送';
        } else {
          document.getElementById('response').innerHTML = `<span class="error">请求失败: ${response.status}</span>`;
        }
      } catch (error) {
        document.getElementById('response').innerHTML = `<span class="error">错误: ${error.message}</span>`;
      }
    }

    async function ocrRecognize() {
      try {
        const response = await fetch(`${baseUrl}/ocr_recognize`);
        if (response.ok) {
          document.getElementById('response').innerHTML = '截图 OCR 请求已发送';
        } else {
          document.getElementById('response').innerHTML = `<span class="error">请求失败: ${response.status}</span>`;
        }
      } catch (error) {
        document.getElementById('response').innerHTML = `<span class="error">错误: ${error.message}</span>`;
      }
    }

    async function ocrTranslate() {
      try {
        const response = await fetch(`${baseUrl}/ocr_translate`);
        if (response.ok) {
          document.getElementById('response').innerHTML = '截图翻译请求已发送';
        } else {
          document.getElementById('response').innerHTML = `<span class="error">请求失败: ${response.status}</span>`;
        }
      } catch (error) {
        document.getElementById('response').innerHTML = `<span class="error">错误: ${error.message}</span>`;
      }
    }
  </script>
</body>
</html>
